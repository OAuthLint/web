# Serves the static Astro build. Runs under nginx-unprivileged (UID 101).
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
  gzip_min_length 1024;

  # writable temp paths for the non-root user
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $sent_http_content_type $cache_control {
    default                         "public, max-age=300, stale-while-revalidate=3600";
    ~*text/html                     "public, max-age=0, must-revalidate";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (parity with the design's _headers, applied at the edge).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; upgrade-insecure-requests" always;

    # Immutable hashed assets
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    location /pagefind/ { add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }

    # Clean URLs: /pricing -> /pricing/index.html or /pricing.html
    location / {
      add_header Cache-Control $cache_control always;
      try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  }
}
