# Git hooks (installed by `pnpm prepare`). Keep fast; bypass only with a
# documented reason via --no-verify, never for CI-blocking issues.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,mjs,astro,json,css}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}
    typecheck:
      run: pnpm typecheck
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner || true
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
pre-push:
  commands:
    test:
      run: pnpm test:run
